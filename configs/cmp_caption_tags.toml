# Text-conditioning A/B on the 2,000 best Pictoria 5-star images (SILVA):
# identical latents, seed and recipe; only the training text differs (caption_tags).
seed = 47
model_path = "/mnt/pan/comfyui/ComfyUI/models/moss-image/base"
model_name = "cmp-caption_tags"
save_dir = "./out/moss_image/cmp-caption_tags"
dataset_path = "datasets/moss-pictoria-top2k/caption_tags"
vae_dtype = "bf16"

max_sequence_length = 4096
shuffle_tags = true
single_tag_dropout = 0.0
all_tags_dropout = 0.0
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]
condition_dropout_prob = 0.1

flow_match_timestep_sampling = "moss"
flow_match_logit_mean = 1.09
flow_match_logit_std = 0.95
flow_match_cutoff = 0.95
flow_match_uniform_mix = 0.01
flow_match_loss_weighting = "uniform"

mode = "lora"
lora_dim = 32
lora_alpha = 32
optimizer = "adamW8bit"
unet_lr = 1e-4
optimizer_warmup_steps = 100
optimizer_num_cycles = 1
max_grad_norm = 1.0

n_epochs = 2
batch_size = 2
gradient_accumulation_steps = 2
dataloader_num_workers = 4
mixed_precision = "bf16"
weight_dtype = "bf16"
save_dtype = "bf16"
gradient_checkpointing = true
enable_flash_attention = false
use_ema = false
noise_offset = 0.0
input_perturbation = 0.0

save_every_n_epochs = 1
preview_every_n_epochs = 0
preview_every_n_steps = 500
checkpoint_every_n_steps = 500

# Previews: the shared eval prompt set (42 prompts, ~25 min per round at 30 steps).
preview_prompt_set = "configs/eval/anime_prompts_v1.toml"
preview_prompt_set_steps = 30
