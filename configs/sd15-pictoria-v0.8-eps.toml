# v0.8-eps stage 2: artist5 taste anneal on the full-library epsilon base. The
# base (stage 1) supplies BREADTH — every artist, the full quality spectrum;
# this stage repaints the DEFAULT distribution toward the top-8 5★ artists
# without losing that breadth (the artists/characters the base learned stay
# accessible by tag). The v-pred line (v0.7/v0.8-vpred) is shelved — its base
# showed a global low-contrast haze (conversion tax) this epsilon line never has.
#
# In this lineage "ideal" means "proven-minimal": every speculative knob we
# tried (input_perturbation, EMA-from-0, sustained high LR, epsilon->v-pred
# conversion) measurably softened detail, so this anneal adds NOTHING new beyond
# the v0.6-eps recipe that swept the four-way sign-off — only the init changes
# (full-library base instead of AOM3B2 directly).
#
# Recipe:
#   - init = the stage-1 full-library base (NOT AOM3B2 directly).
#   - epsilon-native, noise_offset 0.05: covers the dark range fully (sign-off
#     dark luma 13 with readable subject; bright 206, no blowout). The epsilon
#     answer to ZTSNR — no rescale, plain WebUI defaults at inference.
#   - artist5 5★ subset (top-8 artists, best-quality AND), the stated taste target.
#
# Deliberately EXCLUDED, with reason (do not "improve" by adding these):
#   - input_perturbation: > 0 measurably softens detail (v0.4 C vs A).
#   - EMA: no visible effect on a ~1.4k-step anneal (ramp never engages); off = simpler.
#   - Min-SNR (snr_gamma): untested here and v0.6 won at 0; it rebalances the
#     loss the base was already happy with. If ever A/B'd, do it as v0.9 vs this.
#   - v-pred / ZTSNR / rescale: shelved (see header).
#
# Inference: CFG 7.5, guidance_rescale 0, clip_skip 2, hires 1.6/0.45.
#   uv run python run_train.py --config configs/sd15-pictoria-v0.8-eps.toml --model_family sd15
#   (run configs/sd15-pictoria-v0.8-eps-base.toml FIRST)

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "./out/pictoria-v0.8-eps-base/pictoria-v0.8-eps-base"
model_name = "pictoria-v0.8-eps"
save_dir = "./out"

clip_skip = 2

# Explicit epsilon (AOM3B2's native parameterization). Stated rather than
# inherited so the scheduler is unambiguous — the trainer treats explicit
# config values as authoritative.
prediction_type = "epsilon"
rescale_betas_zero_snr = false

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Top-8 artists by usable 5-star count — the stated taste target.
dataset_include_any_tags = [
    "maccha_(mochancc)", "scottie_(phantom2)", "classic_(zildjian33)",
    "colorful_palette", "cutesexyrobutts", "guweiz", "mika_pikazo", "ciloranko",
]
dataset_exclude_tags = [
    # best-quality only: exclude every lower tier to turn include_any into AND.
    "worst quality", "bad quality", "normal quality", "good quality",
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    # AI markers are meta tags (dropped from prompts) — exclude or they train
    # unmarked and bleed the AI look into the default distribution.
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# 1e-5 measured detail-safe for annealing; te at half. Single cosine to 0.
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

# ~1,718 samples; batch 32 -> ~53 steps/epoch, 22 epochs ≈ 1.4k steps (~1.5h).
n_epochs = 22
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.05  # epsilon-native dark-range compensation (no ZTSNR here)
use_multires_noise = false
input_perturbation = 0.0

# Finer than v0.6 (was every 4): the sign-off used ep4-ep20 to dial style
# intensity down, so save every 2 epochs for tighter selection granularity.
save_every_n_epochs = 2
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 200
checkpoint_every_n_steps = 2000

# Preview prompts verbatim from the lineage (same hashes); epsilon -> rescale 0.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.0
hires_scale = 1.6

