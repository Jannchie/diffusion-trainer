# SD 1.5 training streamed from the private HF dataset repo.
# Remote machine prerequisites:
#   1. git clone <this repo> && uv sync
#   2. uv run hf auth login        # private repo needs a read token
#   3. uv run python run_train.py --config configs/sd15-pictoria-5star.toml --model_family sd15
# Streaming is single-GPU for now; epoch 1 downloads shards lazily (overlapped
# with training), later epochs hit the local HF cache.

seed = 47

# Pin a revision for reproducibility if desired: "hf://Jannchie/pictoria-5star-768@<commit>"
dataset_path = "hf://Jannchie/pictoria-5star-768"

# Private HF model repo (diffusers format); downloads to the HF cache on first
# run. A local diffusers directory (e.g. "models/AOM3B2_orangemixs_fp16") works too.
# NOTE: single-file .safetensors paths are broken under transformers 5.x +
# diffusers 0.37 (from_single_file expects the old CLIP layout) — avoid for now.
model_path = "Jannchie/AOM3B2-orangemixs-fp16"
model_name = "pictoria-v0.2"
save_dir = "./out"

# CLIP skip in A1111/WebUI semantics: 2 = penultimate layer (NAI convention).
# NOTE: pictoria-v0.1 checkpoints were trained under the old off-by-one
# semantics (layer 10) - evaluate THOSE in WebUI with CLIP skip 3.
clip_skip = 2

# v-prediction + zero terminal SNR — the only sound pairing (epsilon cannot
# recover x0 at SNR=0). This converts the epsilon base model during the
# finetune: expect washed-out/odd previews for the first ~1-2k steps while
# the parameterization migrates, then true blacks and better dynamic range.
prediction_type = "v_prediction"
rescale_betas_zero_snr = true

# Must match the VAE used at latents-encoding time (see the dataset card):
# raw latents are decoded/previewed with this VAE; scaling_factor applied at training time.
vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

# Text augmentation works in streaming mode too (strings live in the manifest).
shuffle_tags = true
all_tags_dropout = 0.05
single_tag_dropout = 0.05
caption_dropout = 0.0

# Chunked >77-token prompts during training (A1111-style), so shuffled tag
# soups are no longer truncated at 77. Booru parens are escaped automatically
# before the attention-syntax parser (ask_(askzy) stays literal).
use_enhanced_embeddings = true

mode = "full-finetune" # or "lora" (+ lora_dim/lora_alpha) / "lokr"

# Tuned for a single 80GB A100. Activations at 768-base run ~3GB/sample without
# checkpointing, so batch 32 NEEDS gradient_checkpointing (measured OOM at 77GB
# without it); the large batch keeps the GPU saturated despite the recompute.
optimizer = "adamW8bit"
unet_lr = 3e-5          # scaled up with effective batch 32 (was 2e-5 @ 16)
text_encoder_lr = 1.5e-5 # half of unet_lr; improves tag binding on booru-style data
optimizer_warmup_steps = 300
# Single-cycle cosine: restarts mainly help from-scratch training; for a
# finetune with EMA they just inject high-LR turbulence, and a monotonic
# tail makes per-epoch saves monotonically comparable.
optimizer_num_cycles = 1

# ~9.6k samples; batch 32 -> ~305 steps/epoch. Watch previews and stop early.
n_epochs = 20
batch_size = 32
gradient_accumulation_steps = 1
# Streaming workers split shards [id::num_workers]; the dataset has 9 shards,
# 4 workers keep the GPU fed (~5MB/s of decoded latents per second of training).
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = true          # fp32 EMA copy (~3.4GB) — smoother full-finetune results, saved weights use it

# Noise/weighting hygiene for v-pred + ZTSNR (framework defaults are already
# safe; stated explicitly for reproducibility). Min-SNR's v-pred weight
# min(SNR,γ)/(SNR+1) → 0 at the ZTSNR terminal step, and logit-normal sampling
# rarely visits the tail — together they starve the high-noise steps that set
# global structure/color (symptom: growing fragmentation + oversaturation).
snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0          # ZTSNR already restores full dynamic range; offset double-corrects
use_multires_noise = false  # correlated noise ≠ the white noise fed at inference
input_perturbation = 0.05   # sound under v-pred: the target still uses the unperturbed noise

save_every_n_epochs = 2      # 10 full saves (~2GB fp16 each); the 5-15 epoch window still has per-2-epoch granularity for picking the best
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 500  # ~12 preview events; early v-pred conversion output is washed anyway
checkpoint_every_n_steps = 1000  # resume state is ~9GB on a network mount; worst-case loss on crash ≈ 17 min

# Baseline generic prompt — intentionally NO artist tag: this one tracks the
# "dataset average" style as a control against the artist-tagged previews.
[[preview_sample_options]]
prompt = "masterpiece, best quality, 1girl, solo, looking at viewer, long hair, smile"
negative_prompt = "worst quality, bad quality, blurry, low resolution"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7 # required for ZTSNR + v-pred; plain CFG skews exposure

# The following prompts are real tag sets sampled from the dataset (one per
# bucket, width/height = the sample's training bucket) so previews track the
# actual training distribution. Artist tags (from the pictoria DB, group 3)
# are pinned at the front so style conditioning is never truncated; quality
# tags come from the base model's NAI lineage (training data has none).

