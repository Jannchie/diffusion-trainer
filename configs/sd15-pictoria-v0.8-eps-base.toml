# v0.8-eps stage 1: full-library epsilon base. Teaches the model the BREADTH of
# the dataset — every artist and the full quality spectrum — so quality tags
# become real conditioning and the artist vocabulary is wide. This revisits the
# "full-library stage unnecessary" conclusion deliberately: that held when the
# goal was taste-maximization (v0.6 direct anneal won there); here the goal is
# broad capability, which a direct artist5 anneal cannot give.
#
# Why this is safe to do in epsilon (the v0.5 lesson, corrected): v0.5's two-
# stage rebuild produced the SHARPEST base in the lineage — its softness came
# from the epsilon->v-pred conversion, NOT from the full-library stage. With
# v-pred removed, a full-library epsilon base keeps the crisp AOM3B2 rendering.
#
# Three guards against the full-library "dataset-average AI texture" creep:
#   1. only 3 epochs (style shift enters epoch 1; more epochs fray detail).
#   2. AI-marker images excluded (else ~674 untagged AI images bleed the AI look
#      into the default distribution).
#   3. the stage-2 artist5 anneal repaints the default distribution afterward.
#
# Keep ALL quality tiers tagged (worst..best): training the full spectrum is
# what makes "best quality" a meaningful CFG anchor. Only format/source junk
# (3d/comic/photo/AI) is excluded.
#
#   uv run python run_train.py --config configs/sd15-pictoria-v0.8-eps-base.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "models/AOM3B2_orangemixs_fp16"
model_name = "pictoria-v0.8-eps-base"
save_dir = "./out"

clip_skip = 2

# Explicit epsilon (AOM3B2's native parameterization); no ZTSNR.
prediction_type = "epsilon"
rescale_betas_zero_snr = false

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Full library: NO artist filter, ALL quality tiers kept as learnable conditions.
# Exclude only format/source junk and AI markers.
dataset_exclude_tags = [
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    # AI markers are meta tags (dropped from prompts) — exclude or they train
    # unmarked and bleed the AI look into the default distribution.
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# UNet at the v0.5-base band (sharpest lineage base) to carry the breadth
# learning. TE at unet/4 — lower than v0.5's unet/2: over a 12.7k-step
# full-library pass the TE is the main vector for dataset-average style
# homogenization, and the artist/character tokens already exist in AOM3B2's
# vocab, so the TE only needs a light nudge to bind associations the UNet renders.
unet_lr = 1.5e-5
text_encoder_lr = 3.5e-6
optimizer_warmup_steps = 500
optimizer_num_cycles = 1

# ~135k usable samples; batch 32 -> ~4.2k steps/epoch, 3 epochs ≈ 12.7k steps.
n_epochs = 3
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.05  # epsilon-native dark-range compensation (shared with stage 2)
use_multires_noise = false
input_perturbation = 0.0

save_every_n_epochs = 1
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 1000
checkpoint_every_n_steps = 4000

# Preview prompts verbatim from the lineage (same hashes); epsilon -> rescale 0.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.0
hires_scale = 1.6

# Exposure test, dark end: how close noise_offset gets to true blacks.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
