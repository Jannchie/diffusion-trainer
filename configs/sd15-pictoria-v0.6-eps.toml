# v0.6 experiment: artist5 anneal DIRECTLY on AOM3B2, staying epsilon-native.
# Tests whether skipping the epsilon->v-pred conversion (and the full-library
# distribution-shift stage) preserves the base model's decisive, high-confidence
# rendering ("痛快感") while layering on the artist5 taste.
#
# Differences vs the v0.5 artist5 anneal:
#   - init = AOM3B2 itself, not a converted full-library checkpoint
#   - prediction_type unset: keeps the base's native epsilon parameterization;
#     no ZTSNR (rescale_betas_zero_snr off). Inference: guidance_rescale 0.
#   - noise_offset 0.05: partial dark-scene compensation for the missing ZTSNR
#     (epsilon models can't reach true zero-SNR blacks; this narrows the gap)
#   - trained with the empty-prompt fix in diffusion_prompt_embedder: condition
#     dropout now trains the true unconditional ([BOS, EOS*76]), not the
#     literal word "empty" — sharper CFG anchor than every previous run
#
#   uv run python run_train.py --config configs/sd15-pictoria-v0.6-eps.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "models/AOM3B2_orangemixs_fp16"
model_name = "pictoria-v0.6-eps"
save_dir = "./out"

clip_skip = 2

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Top-8 artists by usable 5-star count — identical subset to the v0.5 anneal.
dataset_include_any_tags = [
    "maccha_(mochancc)", "scottie_(phantom2)", "classic_(zildjian33)",
    "colorful_palette", "cutesexyrobutts", "guweiz", "mika_pikazo", "ciloranko",
]
dataset_exclude_tags = [
    # best-quality only: exclude every lower tier to turn include_any into AND.
    "worst quality", "bad quality", "normal quality", "good quality",
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# Same annealing LR band as the polish matrix (1e-5 measured detail-safe).
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

# 1,718 samples; batch 32 -> ~53 steps/epoch, 22 epochs ≈ 1.2k steps.
n_epochs = 22
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.05  # epsilon-native dark-range compensation (no ZTSNR here)
use_multires_noise = false
input_perturbation = 0.0

save_every_n_epochs = 4
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 200
checkpoint_every_n_steps = 2000

# Preview prompts verbatim from the other runs (same hashes), but
# guidance_rescale 0: epsilon models are sampled without rescale.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.0
hires_scale = 1.6

# Exposure test, dark end: how close noise_offset gets to true blacks.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.0
hires_scale = 1.6

# Exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
steps = 25
width = 896
height = 640
clip_skip = 2
guidance_rescale = 0.0
hires_scale = 1.6

