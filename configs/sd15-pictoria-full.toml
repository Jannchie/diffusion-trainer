# SD 1.5 training on the full pictoria library (~142k images, 768 base) with
# category-aware prompts: quality tags from manual scores + SILVA fallback,
# pinned quality/artist/copyright/character prefix, shuffled general tail.
#
# Build the dataset first:
#   uv run python scripts/load_dataset_from_pictoria_db.py \
#       --db ~/datasets-cache/pictoria-snapshot.sqlite \
#       --images-root /mnt/e/pictoria/server/illustration/images \
#       --output-dir datasets/pictoria-full-768 \
#       --vae-path https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors \
#       --vae-dtype bf16 --base-resolution 768 --min-short-edge 768

seed = 47

dataset_path = "datasets/pictoria-full-768"

model_path = "Jannchie/AOM3B2-orangemixs-fp16"
model_name = "pictoria-v0.3"
save_dir = "./out"

clip_skip = 2

prediction_type = "v_prediction"
rescale_betas_zero_snr = true

# Must match the VAE used at latents-encoding time.
vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

# Category-aware text augmentation: the prompt is assembled as
# quality -> year(era) -> artist -> copyright -> character -> general; meta
# tags (highres/commentary/bad_id/...) are not listed, so they never enter
# the prompt. Only the general tail shuffles and drops tags — quality/era/
# artist/copyright/character conditioning always survives at the prompt front.
shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Declarative subsets: one exported dataset serves many runs. Uncomment to
# train only the manually-curated top tier (the old "5star" dataset becomes
# just a filter):
# dataset_include_any_tags = ["best quality"]

# Multi-panel layouts teach the model to slice the canvas and grow speech
# bubbles (a major source of fragmented compositions); photo/3d are not
# illustrations. ~2.7% of samples. Watermark/signature/monochrome etc. stay
# IN on purpose: they are tagged, so negative prompts control them at
# inference and the data is not wasted.
dataset_exclude_tags = ["comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d"]

# Chunked >77-token prompts during training (A1111-style).
use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# Lower peak than the 5star run (3e-5): the ~18k-step schedule moves the model
# through data coverage, not LR heat; 3e-5 over long runs grinds away the base
# model's high-frequency detail (fragmentation). TE at half of UNet — an
# overtrained TE bleeds tag semantics into each other (mushy boundaries).
unet_lr = 2e-5
text_encoder_lr = 1e-5
optimizer_warmup_steps = 500
optimizer_num_cycles = 1

# ~142k samples; batch 32 -> ~4.4k steps/epoch. Watch previews and stop early.
n_epochs = 4
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = true
# Skip warmup + the epsilon->v-pred conversion phase: EMA's horizon at 0.9999
# is ~10k steps, so averaging from step 0 dilutes the final weights with
# half-converted early states (the 5star run's residual base-model artifacts
# and soft detail were partly this).
ema_start_step = 2000

# Noise/weighting hygiene for v-pred + ZTSNR (see sd15-pictoria-5star.toml).
snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0
use_multires_noise = false
# 0.05 was small-data insurance on the 5star run; it softens fine detail.
# 142k samples regularize on their own.
input_perturbation = 0.02

save_every_n_epochs = 1
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 1000
checkpoint_every_n_steps = 2000

# All previews condition on "best quality" (trained tag); negatives use the
# trained quality/noise words. Tags are underscore booru form to match the
# training distribution. The baseline stays era-less so it also tracks the
# dataset-average default output.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, dark end: true blacks instead of washed-out grey.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
steps = 25
width = 896
height = 640
clip_skip = 2
guidance_rescale = 0.7

# Complex character prompt sampled from a real dataset row (parens escaped:
# previews go through the A1111-style parser, unescaped (...) would strip and
# 1.1x-weight the tag, mismatching training).
[[preview_sample_options]]
prompt = 'best quality, newest, ask_\(askzy\), 1girl, arm_guards, black_bow, bow, breasts, cleavage, cleavage_cutout, closed_mouth, clothing_cutout, dark-skinned_female, dark_skin, floating_hair, hair_between_eyes, hair_bow, hair_ornament, high_collar, katana, large_breasts, long_hair, long_sleeves, looking_at_viewer, okita_souji_\(fate\), okita_souji_alter_\(fate\), parted_bangs, petals, red_eyes, solo, sword, tassel, upper_body, very_long_hair, weapon, white_hair, wide_sleeves'
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 50
steps = 25
width = 576
height = 1024
clip_skip = 2
guidance_rescale = 0.7

# Complex scene prompt sampled from a real dataset row (artist + many objects).
[[preview_sample_options]]
prompt = 'best quality, newest, wlop, 1girl, architecture, black_hair, bowl, cat, chinese_clothes, chopsticks, cloak, closed_eyes, day, east_asian_architecture, eating, flower, food, hair_ornament, hanfu, holding, jade_\(ghostblade\), outdoors, plate, short_hair, sitting, solo, table, teapot'
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 51
steps = 25
width = 1024
height = 576
clip_skip = 2
guidance_rescale = 0.7
