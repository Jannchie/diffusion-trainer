# v0.7 stage 1: v-pred + ZTSNR conversion from AOM3B2, with every lesson from
# the v0.5/v0.6 experiments applied. The v-pred lineage's softness traced to
# three causes, each addressed here:
#   1. conversion is cheap (affine remap, ~hundreds of steps) but the ZTSNR
#      terminal regime is a genuinely new task -> curriculum: full plain-v-pred
#      weight for the first 2000 steps (locks the remap AND the terminal/dark
#      capability), then epsilon-equivalent weighting for the remaining ~10.7k
#      steps restores the detail-regime gradient share to epsilon levels
#   2. (SNR+1) implicit weight starved the detail regime -> same switch
#   3. degraded CFG anchor -> trained with the fixed empty-prompt unconditional
#      (diffusion-prompt-embedder >= 0.4.2)
# Plus the v0.5 polish-matrix settings: perturbation 0, EMA off, AI markers
# excluded, 3 epochs, LR 1.5e-5 cosine.
#
# Inference for this model: guidance_rescale ~0.7, CFG 9-11, DDIM/trailing.
#
#   uv run python run_train.py --config configs/sd15-pictoria-v0.7-vpred-base.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "Jannchie/AOM3B2-orangemixs-fp16"
model_name = "pictoria-v0.7-vpred-base"
save_dir = "./out"

clip_skip = 2

prediction_type = "v_prediction"
rescale_betas_zero_snr = true

# Detail-regime protection (see header). Terminal/conversion phase first:
vpred_epsilon_equivalent_weighting = true
vpred_epsilon_equivalent_weighting_start_step = 2000

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

dataset_exclude_tags = [
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    # AI markers are meta tags (dropped from prompts) — exclude or they train
    # unmarked and bleed the AI look into the default distribution.
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
unet_lr = 1.5e-5
text_encoder_lr = 7e-6
optimizer_warmup_steps = 500
optimizer_num_cycles = 1

# ~135k usable samples; batch 32 -> ~4.2k steps/epoch, 3 epochs ≈ 12.7k steps.
n_epochs = 3
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false

snr_gamma = 0  # Min-SNR pulls the opposite way from the detail-protection weighting
timestep_bias_strategy = "uniform"
noise_offset = 0.0  # ZTSNR owns the dynamic range; offset would pollute it
use_multires_noise = false
input_perturbation = 0.0

save_every_n_epochs = 1
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 1000
checkpoint_every_n_steps = 4000

# Preview prompts verbatim (same hashes as every other run). v-pred + ZTSNR:
# previews use guidance_rescale 0.7. Expect washed previews before ~step 2000
# (conversion phase at full weight), darks should mature EARLY this time —
# watch the step-1000/2000 dark preview as the curriculum's health check.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

# ZTSNR exposure test, dark end: true blacks instead of washed-out grey.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

# ZTSNR exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
steps = 25
width = 896
height = 640
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

