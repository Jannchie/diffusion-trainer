# Fixed evaluation prompt set for anime-domain finetunes (MOSS-Image first).
# Rendered by scripts/eval_moss_prompts.py: every model x LoRA gets the same
# prompt, seed and size, so a column in the sheets is a controlled comparison.
#
# Coverage borrows the axes of public text-to-image benchmarks, translated to
# the anime domain:
# - GenEval / T2I-CompBench: counting, colour/attribute binding, left/right
#   and above/below relations;
# - DrawBench / PartiPrompts: text rendering, perspective, rare styles;
# - DPG-Bench: one long dense prompt with many constraints;
# - OneIG-Bench: anime/stylisation, portraits, multilingual (Japanese/Chinese)
#   prompts and in-image text;
# - plus brightness extremes (low-key / high-key / backlight), which flow
#   models tend to pull back towards mid-grey, and a photo group that checks
#   how far an anime finetune bleeds into (or breaks) photorealistic output.
# Tag prompts follow the training format (quality tag first, spaces instead of
# underscores); natural-language prompts follow the recaption style.
# The `legacy` group repeats the six in-training previews (30 -> eval steps).

[defaults]
steps = 50
guidance_scale = 3.0
negative_prompt = ""
width = 1024
height = 1024

