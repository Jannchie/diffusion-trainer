# Aesthetic-alignment comparison: MOSS-Image Base vs the official SFT
# (aesthetic finetune) vs our LoRA (e.g. moss-pictoria-5star on Base).
# Rendered by scripts/eval_moss_prompts.py, e.g.
#
#   --prompts configs/eval/aesthetic_v1.toml \
#   --model base=<Base> --model sft=<SFT> --lora 5star=<lora.safetensors>
#
# anime_prompts_v1.toml measures capability (counting, text, binding); this
# set measures *taste*, so it is built around where the three differ:
# - minimal: under-specified prompts, where the model's own prior decides
#   colour, light and composition. Three seeds each, because a single seed
#   says little about a distribution.
# - format: one subject as bare tags, tags with quality/era tags, and a
#   natural-language caption. The LoRA learned the quality-tag format; Base
#   and SFT did not, so this separates "better taste" from "learned a trigger".
# - style: does the finetune keep requested styles or pull everything to one
#   polished look (style collapse)?
# - plain: prompts that ask for something deliberately unpolished. Strong
#   aesthetic alignment tends to beautify these anyway (over-alignment).
# - people: ages, body types and ordinary faces, to catch same-face and
#   beautification drift.
# - palette / framing: colour restraint and composition choices.
# - general: non-anime photos and scenes, to see how far each one generalises
#   (SFT's glossy look, the LoRA's anime bleed).
# Everything else (steps, CFG, negative prompt) is held fixed.

[defaults]
steps = 50
guidance_scale = 3.0
negative_prompt = ""
width = 1024
height = 1024

# --- minimal: the prior decides -------------------------------------------

[[prompts]]
name = "min_1girl"
category = "minimal"
seeds = [201, 202, 203]
prompt = "1girl"

[[prompts]]
name = "min_anime_girl"
