# Polish variant C ("detail"): variant A (sd15-pictoria-polish.toml) with the
# two anti-detail settings fixed, everything else identical so A-vs-C isolates
# them:
#   1. input_perturbation 0.02 -> 0.0 — fine detail is learned at low-noise
#      timesteps where the true noise is tiny; a fixed 0.02 input perturbation
#      dominates exactly that regime and softens detail (the 5star config
#      already documented 0.05 doing this).
#   2. dataset_exclude_tags += AI markers — ai-assisted/ai-generated are
#      category "meta", which tag_category_order drops from prompts, so those
#      674 images trained with NO distinguishing tag and leaked the AI look
#      into the unconditional distribution.
#
#   uv run python run_train.py --config configs/sd15-pictoria-polish-detail.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "./out/pictoria-v0.3/pictoria-v0.3"
model_name = "pictoria-v0.4-detail"
save_dir = "./out"

clip_skip = 2

# Already v-pred from v0.2 onwards; no conversion phase this time.
prediction_type = "v_prediction"
rescale_betas_zero_snr = true

# Must match the VAE used at latents-encoding time.
vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# The whole point of this run: train only the curated top tier. One exported
# dataset serves both phases; this is just a manifest filter.
dataset_include_any_tags = ["best quality"]
dataset_exclude_tags = [
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    # AI markers are meta tags (dropped from prompts), so excluding them is the
    # only way to keep the look out of the unconditional distribution.
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# Annealing, not learning: half the full-library run's peak (2e-5). High LR on
# 8k samples would grind detail and overfit artists; the goal is to nudge the
# texture prior, keeping v0.3's coverage. TE at half of UNet as usual.
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

# 8,164 samples; batch 32 -> ~255 steps/epoch, 8 epochs ≈ 2k steps total.
# Pick the best epoch from previews/comparisons — style anchoring should land
# well before the end; later epochs are overfit insurance candidates only.
n_epochs = 8
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false  # ablation 2026-06-07: no visible benefit in short anneals; raw weights are what we ship
# 0.9999 has a ~10k-step horizon — on a ~2k-step run the EMA would mostly be
# the init weights and dilute the polish away. 0.999 (~1k-step horizon)
# averages over the last few epochs instead. Start at 0: no conversion phase
# to skip this time, early steps are already on-distribution.
ema_decay_long = 0.999
ema_start_step = 0

# Noise/weighting hygiene for v-pred + ZTSNR (see sd15-pictoria-5star.toml).
snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0
use_multires_noise = false
# Off: see header — perturbation dominates the low-noise (detail) regime.
input_perturbation = 0.0

save_every_n_epochs = 1
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 250
checkpoint_every_n_steps = 1000

# Preview prompts copied verbatim from sd15-pictoria-full.toml so the preview
# hashes match the v0.3 run and stay directly comparable.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, dark end: true blacks instead of washed-out grey.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
