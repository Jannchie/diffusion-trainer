# Polish variant B: artist-anchored annealing on top of pictoria-v0.3.
# Counterpart to sd15-pictoria-polish.toml (variant A, best-quality tier) —
# same LR and ~2k-step budget, only the data differs, so A-vs-B comparisons
# isolate the dataset choice.
#
# Subset: 15 hand-picked artists with high best-quality density in the manual
# scores (maccha, scottie, classic, ciloranko, wlop, kieed, ask, yonesdraws,
# mika_pikazo, guweiz, modare, miwano_rag, machi, momoko, toosaka_asagi),
# intersected with quality ∈ {good, best} by EXCLUDING the lower tiers —
# include_any is an OR filter, so the AND with quality is expressed via
# dataset_exclude_tags. 4,968 rows; batch 32 -> ~155 steps/epoch.
#
# Trade-off vs variant A (documented in out/comparisons): stronger, more
# coherent default style, but the blend bleeds into untagged outputs and can
# weaken other artists' tag response. Compare before adopting.
#
#   uv run python run_train.py --config configs/sd15-pictoria-polish-artist.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "./out/pictoria-v0.3/pictoria-v0.3"
model_name = "pictoria-v0.4-artist"
save_dir = "./out"

clip_skip = 2

prediction_type = "v_prediction"
rescale_betas_zero_snr = true

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Artist tags are tags: include_any selects the union of the 15 artists, and
# excluding the lower quality tiers turns the union into "artist AND good+".
dataset_include_any_tags = [
    "maccha_(mochancc)", "scottie_(phantom2)", "classic_(zildjian33)",
    "ciloranko", "wlop", "kieed", "ask_(askzy)", "yonesdraws",
    "mika_pikazo", "guweiz", "modare", "miwano_rag", "machi_(machi0910)",
    "momoko_(momopoco)", "toosaka_asagi",
]
dataset_exclude_tags = [
    "worst quality", "bad quality", "normal quality",
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# Same annealing LR as variant A for a clean comparison.
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

# ~4,968 samples; batch 32 -> ~155 steps/epoch, 12 epochs ≈ 1.9k steps (same
# budget as variant A's 8 x 255). Per-artist counts are 150-450, so later
# epochs are the overfit window — pick from previews.
n_epochs = 12
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false  # ablation 2026-06-07: no visible benefit in short anneals; raw weights are what we ship
# See variant A: 0.999 (~1k-step horizon) suits a ~2k-step run; 0.9999 would
# mostly retain the init weights.
ema_decay_long = 0.999
ema_start_step = 0

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0
use_multires_noise = false
input_perturbation = 0.02

# Every 2 epochs (~310 steps): 6 fp16 saves ≈ 12GB; disk is shared with run A.
save_every_n_epochs = 2
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 250
checkpoint_every_n_steps = 2000

# Preview prompts copied verbatim from sd15-pictoria-full.toml so the preview
# hashes match the v0.3 and variant-A runs and stay directly comparable.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, dark end: true blacks instead of washed-out grey.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.7

# ZTSNR exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
steps = 25
width = 896
height = 640
clip_skip = 2
guidance_rescale = 0.7

# Complex character prompt sampled from a real dataset row (parens escaped:
# previews go through the A1111-style parser, unescaped (...) would strip and
# 1.1x-weight the tag, mismatching training).
