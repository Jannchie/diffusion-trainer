# Two inference-side ablations on v0.4-detail, no retraining:
#   1. EMA vs non-EMA — the -noema variant carries the raw step-2000 UNet from
#      the accelerate state (EMA only wraps the UNet; the saved TE is already
#      raw), so the pair isolates what EMA's weight averaging smooths away.
#   2. guidance_rescale sweep (0.7 / 0.5 / 0.3) — rescale fixes ZTSNR+CFG
#      exposure but flattens micro-contrast; find the detail/exposure tradeoff.

output_dir = "out/comparisons/ema-rescale-ablation"
seeds = [47, 1024]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
hires_scale = 1.6
hires_strength = 0.45
hires_steps = 20

[[models]]
name = "EMA r0.7"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "noEMA r0.7"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail-noema"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "EMA r0.5"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail"
guidance_rescale = 0.5
clip_skip = 2

[[models]]
name = "noEMA r0.5"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail-noema"
guidance_rescale = 0.5
clip_skip = 2

[[models]]
name = "EMA r0.3"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail"
guidance_rescale = 0.3
clip_skip = 2

