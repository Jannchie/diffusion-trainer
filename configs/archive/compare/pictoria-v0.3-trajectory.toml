# Training-trajectory diagnosis: where does the "abstract/loose" look enter?
# AOM3B2 (epsilon ancestor) | v0.2 (init weights) | ep1..ep3 | v0.3 final.
# All pictoria checkpoints are EMA saves with identical v-pred/ZTSNR schedulers,
# so panel-to-panel differences are purely training progress.
#
#   uv run python scripts/compare_models.py --config configs/compare/pictoria-v0.3-trajectory.toml

output_dir = "out/comparisons/pictoria-v0.3-trajectory"
seeds = [47]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"

[[models]]
name = "AOM3B2"
path = "models/AOM3B2_orangemixs_fp16"
guidance_rescale = 0.0
clip_skip = 2

[[models]]
name = "v0.2 (init)"
path = "out/pictoria-v0.2/pictoria-v0.2"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "v0.3 ep1"
path = "out/pictoria-v0.3/pictoria-v0.3-ep1"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "v0.3 ep2"
path = "out/pictoria-v0.3/pictoria-v0.3-ep2"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "v0.3 ep3"
path = "out/pictoria-v0.3/pictoria-v0.3-ep3"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "v0.3 final"
path = "out/pictoria-v0.3/pictoria-v0.3"
guidance_rescale = 0.7
clip_skip = 2

