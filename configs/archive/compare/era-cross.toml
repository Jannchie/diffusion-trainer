# Era cross-test: same prompt, era tag swept oldest -> newest, on the two
# best polish candidates. Tests the hypothesis that the "AI look" is partly
# the trained `newest` (2023+) era style itself — if `recent`/`mid` reads
# less AI-flavored, prompt-side era control is a free mitigation.

output_dir = "out/comparisons/era-cross"
seeds = [47, 1024]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
hires_scale = 1.6
hires_strength = 0.45
hires_steps = 20

[[models]]
name = "C detail"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail"
guidance_rescale = 0.7
clip_skip = 2

[[models]]
name = "D artist5"
path = "out/pictoria-v0.4-artist5/pictoria-v0.4-artist5"
guidance_rescale = 0.7
clip_skip = 2

[[prompts]]
category = "era-oldest"
prompt = "best quality, oldest, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896

[[prompts]]
category = "era-early"
prompt = "best quality, early, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896

[[prompts]]
category = "era-mid"
prompt = "best quality, mid, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896

[[prompts]]
category = "era-recent"
prompt = "best quality, recent, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896

[[prompts]]
category = "era-newest"
prompt = "best quality, newest, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896

[[prompts]]
category = "era-none"
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, school_uniform, upper_body"
width = 640
height = 896
