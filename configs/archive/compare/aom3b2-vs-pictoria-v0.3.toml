# Side-by-side comparison: AOM3B2 (epsilon base) vs pictoria-v0.3 (v-pred ZTSNR
# full finetune). Consumed by scripts/compare_models.py:
#
#   uv run python scripts/compare_models.py --config configs/compare/aom3b2-vs-pictoria-v0.3.toml
#
# Both models share prompt text, seed and initial latents; inference settings
# differ per model because each must run at its own training-matched optimum
# (pictoria: saved DDIM v-pred/ZTSNR/trailing + CFG rescale 0.7; AOM3B2: DDIM
# epsilon, no rescale). Tags are underscore booru form; parens are escaped
# because prompts go through the A1111-style attention parser.

output_dir = "out/comparisons/aom3b2-vs-pictoria-v0.3"
seeds = [47, 1024]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"

[[models]]
name = "AOM3B2"
path = "models/AOM3B2_orangemixs_fp16"
# Epsilon model: keep its own scheduler betas, just force DDIM for parity.
guidance_rescale = 0.0
clip_skip = 2

[[models]]
name = "pictoria-v0.3"
path = "out/pictoria-v0.3/pictoria-v0.3"
# v-pred + ZTSNR: needs CFG rescale to avoid washed-out/overexposed samples.
guidance_rescale = 0.7
clip_skip = 2

