# Add-difference merge sweep: AOM3B2 + alpha*(v0.5 - v0.5-base), staying
# epsilon-native (rescale 0, CFG 7.5 — AOM3B2's home regime). Tests whether
# the artist5 taste delta transports onto the undamaged base without paying
# the v-pred conversion tax. v0.5 included as the v-pred reference point.

output_dir = "out/comparisons/eps-merge-sweep"
seeds = [47, 1024]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
hires_scale = 1.6
hires_strength = 0.45
hires_steps = 20

[[models]]
name = "AOM3B2"
path = "models/AOM3B2_orangemixs_fp16"
guidance_rescale = 0.0
clip_skip = 2

