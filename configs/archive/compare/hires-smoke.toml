# Hires-fix smoke comparison: small-face / full-body stress prompts where the
# single-pass 768 latent resolution bottlenecks facial detail. 2 models only —
# sized to run alongside an active training job without competing for VRAM.

output_dir = "out/comparisons/hires-smoke"
seeds = [47]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
hires_scale = 1.6
hires_strength = 0.45
hires_steps = 20

[[models]]
name = "AOM3B2"
path = "models/AOM3B2_orangemixs_fp16"
guidance_rescale = 0.0
clip_skip = 2

[[models]]
name = "v0.4-detail"
path = "out/pictoria-v0.4-detail/pictoria-v0.4-detail"
guidance_rescale = 0.7
clip_skip = 2

