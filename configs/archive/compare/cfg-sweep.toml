# CFG sweep on v0.4-artist5 (the taste-anchor model): same model at four
# guidance scales, rescale fixed at 0.7. Higher CFG = stronger prompt
# adherence and saturation/"pop", at the risk of artifacting and oversaturation
# (partly absorbed by rescale on v-pred models).

output_dir = "out/comparisons/cfg-sweep"
seeds = [47, 1024]
steps = 28
guidance_scale = 7.5
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
hires_scale = 1.6
hires_strength = 0.45
hires_steps = 20

[[models]]
name = "cfg 5.5"
path = "out/pictoria-v0.4-artist5/pictoria-v0.4-artist5"
guidance_rescale = 0.7
guidance_scale = 5.5
clip_skip = 2

