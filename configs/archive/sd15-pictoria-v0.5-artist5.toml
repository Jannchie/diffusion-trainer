# v0.5 stage 2: artist5 anneal (top-8 manual-5★ artists, 5★ rows only) on top
# of the rebuilt v0.5 base — identical recipe to the proven v0.4 variant D,
# only the init checkpoint differs (undamaged base instead of v0.3).
#
#   uv run python run_train.py --config configs/sd15-pictoria-v0.5-artist5.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "./out/pictoria-v0.5-base/pictoria-v0.5-base"
model_name = "pictoria-v0.5"
save_dir = "./out"

clip_skip = 2

prediction_type = "v_prediction"
rescale_betas_zero_snr = true

vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Top-8 artists by usable 5-star count (maccha 257, scottie 257, classic 250,
# colorful_palette 214, cutesexyrobutts 204, guweiz 197, mika_pikazo 196,
# ciloranko 146).
dataset_include_any_tags = [
    "maccha_(mochancc)", "scottie_(phantom2)", "classic_(zildjian33)",
    "colorful_palette", "cutesexyrobutts", "guweiz", "mika_pikazo", "ciloranko",
]
dataset_exclude_tags = [
    # best-quality only: exclude every lower tier to turn include_any into AND.
    "worst quality", "bad quality", "normal quality", "good quality",
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
# Same annealing LR as A/B/C for comparability across the matrix.
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

# 1,718 samples; batch 32 -> ~53 steps/epoch, 22 epochs ≈ 1.2k steps (~22
# repeats per image — style-anchor territory). Saves every 4 epochs map the
# overfit window; pick the best from comparisons.
n_epochs = 22
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false  # ablation 2026-06-07: no visible benefit in short anneals; raw weights are what we ship
# See variant A: 0.999 (~1k-step horizon) suits a ~1.2k-step run.
ema_decay_long = 0.999
ema_start_step = 0

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0
use_multires_noise = false
# Off: perturbation dominates the low-noise (detail) regime — see variant C.
input_perturbation = 0.0

save_every_n_epochs = 4
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 200
checkpoint_every_n_steps = 2000

# Preview prompts copied verbatim from sd15-pictoria-full.toml so the preview
# hashes match every other run and stay directly comparable.

# Baseline: simple prompt, dataset-average era.
[[preview_sample_options]]
prompt = "best quality, 1girl, solo, looking_at_viewer, long_hair, smile"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 47
steps = 25
width = 768
height = 768
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

# ZTSNR exposure test, dark end: true blacks instead of washed-out grey.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, black_dress, dark, night, moonlight, black_background, looking_at_viewer"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 48
steps = 25
width = 640
height = 896
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

# ZTSNR exposure test, bright end: high-key lighting without blowout.
[[preview_sample_options]]
prompt = "best quality, newest, 1girl, solo, white_dress, sunlight, day, blue_sky, cloud, field, flower, wind, smile, backlighting"
negative_prompt = "worst quality, bad quality, blurry, watermark, signature"
seed = 49
steps = 25
width = 896
height = 640
clip_skip = 2
guidance_rescale = 0.7
hires_scale = 1.6

