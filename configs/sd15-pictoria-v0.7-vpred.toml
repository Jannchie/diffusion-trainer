# v0.7 stage 2: artist5 anneal on the v-pred base — identical taste recipe to
# v0.6-eps (the current sign-off winner), only the parameterization differs.
# Detail-protection weighting is ON FROM STEP 0 here: the base already learned
# the remap and the terminal regime; the anneal should spend its gradient on
# style/detail, not on re-litigating structure.
#
# Final comparison after this run answers: does fixed v-pred beat v0.6-eps
# (it must win on BOTH decisiveness-parity AND dark range to displace it).
#
#   uv run python run_train.py --config configs/sd15-pictoria-v0.7-vpred.toml --model_family sd15

seed = 47

dataset_path = "hf://Jannchie/pictoria-full-768"

model_path = "./out/pictoria-v0.7-vpred-base/pictoria-v0.7-vpred-base"
model_name = "pictoria-v0.7-vpred"
save_dir = "./out"

clip_skip = 2

prediction_type = "v_prediction"
rescale_betas_zero_snr = true


vae_path = "https://huggingface.co/stabilityai/sd-vae-ft-mse-original/blob/main/vae-ft-mse-840000-ema-pruned.safetensors"
vae_dtype = "bf16"

shuffle_tags = true
single_tag_dropout = 0.05
all_tags_dropout = 0.05
caption_dropout = 0.0
tag_category_order = ["quality", "year", "artist", "copyright", "character", "general"]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]

# Top-8 artists by usable 5-star count — identical subset to v0.5/v0.6 anneals.
dataset_include_any_tags = [
    "maccha_(mochancc)", "scottie_(phantom2)", "classic_(zildjian33)",
    "colorful_palette", "cutesexyrobutts", "guweiz", "mika_pikazo", "ciloranko",
]
dataset_exclude_tags = [
    # best-quality only: exclude every lower tier to turn include_any into AND.
    "worst quality", "bad quality", "normal quality", "good quality",
    "comic", "4koma", "2koma", "silent_comic", "photo_(medium)", "3d",
    "ai-assisted", "ai-generated", "ai_generated", "nai_diffusion",
]

use_enhanced_embeddings = true

mode = "full-finetune"

optimizer = "adamW8bit"
unet_lr = 1e-5
text_encoder_lr = 5e-6
optimizer_warmup_steps = 100
optimizer_num_cycles = 1

n_epochs = 22
batch_size = 32
gradient_accumulation_steps = 1
dataloader_num_workers = 4

mixed_precision = "bf16"
weight_dtype = "fp32"
save_dtype = "fp16"
gradient_checkpointing = true
enable_flash_attention = true

use_ema = false

snr_gamma = 0
timestep_bias_strategy = "uniform"
noise_offset = 0.0
use_multires_noise = false
input_perturbation = 0.0

save_every_n_epochs = 4
save_every_n_steps = 0
preview_every_n_epochs = 0
preview_every_n_steps = 200
checkpoint_every_n_steps = 2000

# Preview prompts verbatim (same hashes as every other run); rescale 0.7.

