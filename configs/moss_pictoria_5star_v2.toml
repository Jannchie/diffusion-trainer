# Full Pictoria 5-star set in MOSS-Image's USERGUIDE tag spelling (spaces, @artist,
# its category order); otherwise = moss_pictoria_5star.toml.
seed = 47
model_path = "/mnt/pan/comfyui/ComfyUI/models/moss-image/base"
model_name = "moss-pictoria-5star-v2"
save_dir = "./out/moss_image/moss-pictoria-5star-v2"
dataset_path = "datasets/moss-pictoria-5star/caption_tags"
vae_dtype = "bf16"

max_sequence_length = 4096
shuffle_tags = true
single_tag_dropout = 0.0
all_tags_dropout = 0.0
caption_dropout = 0.0
tag_category_order = ["quality", "meta", "year", "character", "copyright", "artist", "general"]
tag_underscores_to_spaces = true
tag_category_prefixes = { artist = "@" }
# meta keeps only tags that describe the image (resolution, medium, provenance
# of the art itself); commentary/source/request/bookkeeping tags are dropped.
tag_category_allowlists.meta = [
  "highres", "absurdres", "incredibly_absurdres", "lowres",
  "official_art", "official_wallpaper", "promotional_art", "key_visual", "concept_art",
  "game_cg", "visual_novel_cg", "game_asset", "novel_illustration",
  "scan", "magazine_scan",
  "traditional_media", "mixed_media", "photoshop_(medium)", "procreate_(medium)",
  "clip_studio_paint_(medium)", "painting_(medium)", "watercolor_(medium)", "photo_(medium)",
  "ai-generated", "ai-assisted", "unfinished", "textless_version", "adversarial_noise", "upscaled",
]
shuffled_tag_categories = ["general"]
droppable_tag_categories = ["general"]
condition_dropout_prob = 0.1

flow_match_timestep_sampling = "moss"
flow_match_logit_mean = 1.09
flow_match_logit_std = 0.95
flow_match_cutoff = 0.95
flow_match_uniform_mix = 0.01
flow_match_loss_weighting = "uniform"

mode = "lora"
lora_dim = 32
lora_alpha = 32
optimizer = "adamW8bit"
unet_lr = 1e-4
optimizer_warmup_steps = 100
optimizer_num_cycles = 1
max_grad_norm = 1.0

n_epochs = 3
batch_size = 2
gradient_accumulation_steps = 2
dataloader_num_workers = 4
mixed_precision = "bf16"
weight_dtype = "bf16"
save_dtype = "bf16"
gradient_checkpointing = true
enable_flash_attention = false
use_ema = false
noise_offset = 0.0
input_perturbation = 0.0

save_every_n_epochs = 1
save_every_n_steps = 1000
preview_every_n_epochs = 0
preview_every_n_steps = 1000
checkpoint_every_n_steps = 500

# Previews: the shared eval prompt set v2 (see its header).
preview_prompt_set = "configs/eval/anime_prompts_v2.toml"
preview_prompt_set_steps = 30

